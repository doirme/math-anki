[tool.poetry]
name = "math-anki"
version = "0.1.0"
description = "Extraction de cours/exos maths → cartes Anki"
authors = ["Axel <axel@example.com>"]
readme = "README.md"
packages = [
    { include = "core", from = "src" },
    { include = "db", from = "src" },
    { include = "exporters", from = "src" },
    { include = "ui", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = "^2.7"
regex = "^2024.5.15"
markdown-it-py = "^3.0.0"
beautifulsoup4 = "^4.12"
pymupdf = "^1.24.9"
ocrmypdf = "^16.0.0"
pdfplumber = "^0.11.4"
python-dotenv = "^1.0"
sentence-transformers = "^3.0.1"
langdetect = "^1.0.9"
faiss-cpu = "^1.8.0"
streamlit = "^1.37"
genanki = "^0.13.1"
SQLAlchemy = "^2.0"
sqlmodel = "^0.0.21"
uvicorn = "^0.30.0"
click = "^8.1"
rich = "^13.7"
nougat-ocr = "^0.1.17"
torch = "^2.3.0"
requests = "^2.32.3"
albumentations = "1.3.1"
transformers = ">=4.42,<5"
safetensors = "<0.4.5"
openai = ">=1.0,<2.0"
modal = ">=0.61,<1.0"
docling = "^2.54.0"
mistralai = "^1.9.11"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.5"
black = "^24.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
